<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Build loop</title>
  <desc id="desc">A product and engineering loop: understand, model, build, validate, observe, repair.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300"><stop stop-color="#08111D"/><stop offset=".52" stop-color="#0C1320"/><stop offset="1" stop-color="#130F22"/></linearGradient>
    <linearGradient id="flow" x1="140" y1="0" x2="1060" y2="0"><stop stop-color="#38BDF8"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .flow{stroke-dasharray:12 12;animation:move 8s linear infinite}
    .node{animation:pulse 4s ease-in-out infinite}
    .n2{animation-delay:.5s}.n3{animation-delay:1s}.n4{animation-delay:1.5s}.n5{animation-delay:2s}.n6{animation-delay:2.5s}
    @keyframes move{to{stroke-dashoffset:-96}}
    @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.flow,.node{animation:none}}
  </style>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#bg)" stroke="#1E293B"/>
  <text x="54" y="53" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3">MY DEFAULT BUILD LOOP</text>
  <path class="flow" d="M150 155H1050" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1040 145l16 10-16 10" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1050 188c-76 66-824 69-900 0" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 8"/>
  <path d="M160 198l-13-10 15-7" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <g class="node"><circle cx="165" cy="155" r="34" fill="#0B1725" stroke="#38BDF8" stroke-width="2"/><text x="165" y="151" fill="#F8FAFC" font-size="15" font-weight="700">UNDERSTAND</text><text x="165" y="174" fill="#7DD3FC" font-size="11">real problem</text></g>
    <g class="node n2"><circle cx="340" cy="155" r="34" fill="#101425" stroke="#60A5FA" stroke-width="2"/><text x="340" y="151" fill="#F8FAFC" font-size="15" font-weight="700">MODEL</text><text x="340" y="174" fill="#93C5FD" font-size="11">constraints</text></g>
    <g class="node n3"><circle cx="515" cy="155" r="34" fill="#151126" stroke="#A78BFA" stroke-width="2"/><text x="515" y="151" fill="#F8FAFC" font-size="15" font-weight="700">BUILD</text><text x="515" y="174" fill="#C4B5FD" font-size="11">small &amp; clear</text></g>
    <g class="node n4"><circle cx="690" cy="155" r="34" fill="#151126" stroke="#C084FC" stroke-width="2"/><text x="690" y="151" fill="#F8FAFC" font-size="15" font-weight="700">VALIDATE</text><text x="690" y="174" fill="#D8B4FE" font-size="11">evidence</text></g>
    <g class="node n5"><circle cx="865" cy="155" r="34" fill="#0E1820" stroke="#34D399" stroke-width="2"/><text x="865" y="151" fill="#F8FAFC" font-size="15" font-weight="700">OBSERVE</text><text x="865" y="174" fill="#6EE7B7" font-size="11">real behavior</text></g>
    <g class="node n6"><circle cx="1040" cy="155" r="34" fill="#0C1915" stroke="#22C55E" stroke-width="2"/><text x="1040" y="151" fill="#F8FAFC" font-size="15" font-weight="700">REPAIR</text><text x="1040" y="174" fill="#86EFAC" font-size="11">then simplify</text></g>
  </g>
  <text x="600" y="255" text-anchor="middle" fill="#64748B" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1.7">SHIP IS NOT THE END OF THE LOOP — IT IS WHERE REAL EVIDENCE STARTS</text>
</svg>
