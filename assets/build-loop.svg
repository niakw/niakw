<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Build loop</title><desc id="desc">Understand, model, build, validate, observe, repair.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260"><stop stop-color="#08111D"/><stop offset=".52" stop-color="#0C1320"/><stop offset="1" stop-color="#130F22"/></linearGradient>
  <linearGradient id="flow" x1="100" y1="0" x2="1100" y2="0"><stop stop-color="#38BDF8"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
</defs>
<style>
.flow{stroke-dasharray:14 12;animation:move 8s linear infinite}@keyframes move{to{stroke-dashoffset:-104}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="258" rx="24" fill="url(#bg)" stroke="#1E293B"/>
<text x="54" y="47" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="18" font-weight="700" letter-spacing="3">MY DEFAULT BUILD LOOP</text>
<path class="flow" d="M112 135H1080" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
<path d="M1070 124l18 11-18 11" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Inter,system-ui,sans-serif" text-anchor="middle" font-size="22" font-weight="760">
  <g><rect x="66" y="95" width="166" height="80" rx="22" fill="#0B1725" stroke="#38BDF8" stroke-width="2"/><text x="149" y="143" fill="#F8FAFC">UNDERSTAND</text></g>
  <g><rect x="252" y="95" width="150" height="80" rx="22" fill="#101425" stroke="#60A5FA" stroke-width="2"/><text x="327" y="143" fill="#F8FAFC">MODEL</text></g>
  <g><rect x="422" y="95" width="145" height="80" rx="22" fill="#151126" stroke="#A78BFA" stroke-width="2"/><text x="494" y="143" fill="#F8FAFC">BUILD</text></g>
  <g><rect x="587" y="95" width="164" height="80" rx="22" fill="#151126" stroke="#C084FC" stroke-width="2"/><text x="669" y="143" fill="#F8FAFC">VALIDATE</text></g>
  <g><rect x="771" y="95" width="164" height="80" rx="22" fill="#0E1820" stroke="#34D399" stroke-width="2"/><text x="853" y="143" fill="#F8FAFC">OBSERVE</text></g>
  <g><rect x="955" y="95" width="164" height="80" rx="22" fill="#0C1915" stroke="#22C55E" stroke-width="2"/><text x="1037" y="143" fill="#F8FAFC">REPAIR</text></g>
</g>
<text x="600" y="222" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="19" font-weight="650" letter-spacing="1.5">SHIP → TEST → LEARN → REPAIR → SIMPLIFY</text>
</svg>
