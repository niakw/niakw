<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">NIAK</title><desc id="desc">Engineering, product and automation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360"><stop stop-color="#06101D"/><stop offset=".52" stop-color="#0B1220"/><stop offset="1" stop-color="#151026"/></linearGradient>
  <linearGradient id="accent" x1="90" y1="0" x2="1090" y2="0"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
  <radialGradient id="glow1"><stop stop-color="#0EA5E9" stop-opacity=".24"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop stop-color="#8B5CF6" stop-opacity=".20"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#94A3B8" stroke-opacity=".055"/></pattern>
  <style>
    .pulse{animation:pulse 5s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.pulse,.drift{animation:none}}
  </style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="170" cy="70" r="260" fill="url(#glow1)"/>
<circle cx="1020" cy="300" r="280" fill="url(#glow2)"/>

<text x="76" y="72" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="650" letter-spacing="4">ENGINEERING × PRODUCT × AUTOMATION</text>
<text x="72" y="205" fill="#F8FAFC" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="126" font-weight="820" letter-spacing="-8">NIAK</text>
<rect x="78" y="226" width="610" height="5" rx="3" fill="url(#accent)"/>
<text x="78" y="280" fill="#E2E8F0" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="650">Engineer-minded builder for useful digital systems.</text>
<text x="78" y="321" fill="#94A3B8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="500">Software · E-commerce · AI · Automation · Open Source</text>

<g transform="translate(855 73)" class="drift">
  <rect width="245" height="214" rx="34" fill="#0A1422" stroke="#334155" stroke-width="2"/>
  <rect x="18" y="18" width="209" height="178" rx="27" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".8"/>
  <path d="M62 161V54h22l78 72V54h30v107h-24L92 91v70H62z" fill="url(#accent)" class="pulse"/>
</g>
</svg>
