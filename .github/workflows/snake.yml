name: Generate profile visuals

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution graph
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate public profile metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import collections
          import datetime as dt
          import html
          import json
          import os
          import pathlib
          import urllib.request

          owner = os.environ["PROFILE_OWNER"]
          token = os.environ.get("GH_TOKEN", "")
          url = f"https://api.github.com/users/{owner}/repos?per_page=100&type=owner&sort=updated"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "profile-metrics-workflow",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              repos = json.load(response)

          projects = [r for r in repos if not r.get("fork") and r.get("name") != owner]
          stars = sum(int(r.get("stargazers_count", 0)) for r in projects)
          langs = collections.Counter(r.get("language") for r in projects if r.get("language"))
          top_lang = langs.most_common(1)[0][0] if langs else "—"

          pushed = [r.get("pushed_at") for r in projects if r.get("pushed_at")]
          if pushed:
              latest = max(dt.datetime.fromisoformat(v.replace("Z", "+00:00")) for v in pushed)
              latest_label = latest.strftime("%d %b %Y")
          else:
              latest_label = "—"

          values = [
              (str(len(projects)), "PUBLIC PROJECTS"),
              (str(stars), "TOTAL STARS"),
              (html.escape(top_lang), "PRIMARY LANGUAGE"),
              (html.escape(latest_label), "LAST PUBLIC PUSH"),
          ]

          positions = [75, 330, 585, 840]
          blocks = []
          for (value, label), x in zip(values, positions):
              size = 40 if len(value) <= 12 else 31
              blocks.append(f'''
                <g transform="translate({x} 0)">
                  <text x="0" y="102" fill="#F8FAFC" font-family="Inter,system-ui,sans-serif" font-size="{size}" font-weight="800">{value}</text>
                  <text x="0" y="137" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="1.4">{label}</text>
                  <rect x="0" y="157" width="185" height="3" rx="2" fill="url(#accent)" opacity=".85"/>
                </g>''')

          svg = f'''<svg width="1100" height="200" viewBox="0 0 1100 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
            <title id="title">Public GitHub metrics for {html.escape(owner)}</title>
            <desc id="desc">Automatically generated from public GitHub repository data.</desc>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="200"><stop stop-color="#07111B"/><stop offset=".52" stop-color="#0D1320"/><stop offset="1" stop-color="#151022"/></linearGradient>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8"/><stop offset=".52" stop-color="#A78BFA"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
            </defs>
            <rect x="1" y="1" width="1098" height="198" rx="22" fill="url(#bg)" stroke="#263244"/>
            <text x="44" y="44" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="16" font-weight="700" letter-spacing="2.5">PUBLIC GITHUB SNAPSHOT · AUTO-GENERATED</text>
            {''.join(blocks)}
          </svg>'''

          pathlib.Path("dist").mkdir(parents=True, exist_ok=True)
          pathlib.Path("dist/profile-metrics.svg").write_text(svg, encoding="utf-8")
          PY

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
